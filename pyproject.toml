[project]
name = "teslafare"
version = "0.1.2"
description = "Cost-first Tesla Supercharger road-trip planner"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "jinja2>=3.1,<4",
  "playwright>=1.49,<2",
  "selenium>=4.29,<5",
  "tzdata>=2025.2",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.uv]
package = false
