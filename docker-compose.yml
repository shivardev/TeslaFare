services:
  tesla-route-planner:
    build: .
    image: tesla-route-planner:latest
    container_name: tesla-route-planner
    restart: unless-stopped
    ports:
      # Host port (left) can be changed with HOST_PORT=9000 docker compose up -d
      - "${HOST_PORT:-8000}:8000"
    volumes:
      # Saved prices and caches survive restarts and rebuilds.
      - tesla-data:/data
      # The container's own git clone; updated on every start when AUTO_UPDATE is true.
      - tesla-code:/src
    environment:
      TZ: ${TZ:-America/New_York}
      # On every start: pull this repo/branch and run the latest code (falls back to the last good copy).
      AUTO_UPDATE: ${AUTO_UPDATE:-true}
      REPO_URL: ${REPO_URL:-https://github.com/shivardev/TeslaFare.git}
      REPO_BRANCH: ${REPO_BRANCH:-main}
      PUBLIC_URL: ${PUBLIC_URL:-}
      # Real visitor IP when behind Cloudflare/a proxy (e.g. CF-Connecting-IP); used by the price guardrails.
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-}
      COMMUNITY_PRICES: ${COMMUNITY_PRICES:-true}
      CONTRIBUTOR_KEYS: ${CONTRIBUTOR_KEYS:-}
      CENTRAL_PRICE_URL: ${CENTRAL_PRICE_URL-https://teslaflare.blazingbane.com}
      CENTRAL_CONTRIBUTOR_KEY: ${CENTRAL_CONTRIBUTOR_KEY:-}
      # Optional admin key (not required unless REQUIRE_COLLECTOR_KEY=true).
      COLLECTOR_KEY: ${COLLECTOR_KEY:-}
      REQUIRE_COLLECTOR_KEY: ${REQUIRE_COLLECTOR_KEY:-false}
      PRICE_FRESH_HOURS: ${PRICE_FRESH_HOURS:-24}
      CORRIDOR_MILES: ${CORRIDOR_MILES:-50}
      MAX_CANDIDATE_CHARGERS: ${MAX_CANDIDATE_CHARGERS:-24}
      MAX_CHARGER_DETOUR_MINUTES: ${MAX_CHARGER_DETOUR_MINUTES:-15}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  tesla-data:
  tesla-code:
