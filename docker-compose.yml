services:
  tesla-route-planner:
    build: .
    image: tesla-route-planner:latest
    container_name: tesla-route-planner
    restart: unless-stopped
    ports:
      # Host port (left) can be changed with HOST_PORT=9000 docker compose up -d
      - "${HOST_PORT:-8000}:8000"
    volumes:
      # Saved prices and caches survive restarts and rebuilds.
      - tesla-data:/data
    # Firefox needs more shared memory than Docker's 64 MB default.
    shm_size: "1gb"
    environment:
      TZ: ${TZ:-America/New_York}
      # Prices come from your browser via /collect; set a long random COLLECTOR_KEY to turn it on.
      COLLECTOR_KEY: ${COLLECTOR_KEY:-}
      PRICE_FRESH_HOURS: ${PRICE_FRESH_HOURS:-24}
      # Server-side lookups through headless Firefox are off unless you set this to true.
      SERVER_PRICE_LOOKUPS: ${SERVER_PRICE_LOOKUPS:-false}
      TESLA_PLAYWRIGHT_HEADLESS: "true"
      TESLA_PLAYWRIGHT_FALLBACK: ${TESLA_PLAYWRIGHT_FALLBACK:-true}
      TESLA_PLAYWRIGHT_MAX_FALLBACKS: ${TESLA_PLAYWRIGHT_MAX_FALLBACKS:-40}
      PRICING_CACHE_HOURS: ${PRICING_CACHE_HOURS:-6}
      CORRIDOR_MILES: ${CORRIDOR_MILES:-50}
      MAX_CANDIDATE_CHARGERS: ${MAX_CANDIDATE_CHARGERS:-24}
      MAX_CHARGER_DETOUR_MINUTES: ${MAX_CHARGER_DETOUR_MINUTES:-15}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  tesla-data:
